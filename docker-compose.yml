# Labeler interface. Pick one way to reach the printer below, then: docker compose up -d
# and open http://<server>:8080/. Details: docs/DOCKER.md
services:
  labeler:
    image: ghcr.io/philippmundhenk/labeler:latest
    # build: .                       # or build the image from this checkout
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data                 # print log and fonts (put .ttf/.otf/.woff2 into ./data/fonts)
    environment:
      # 1) a network printer: ptouch detects model and tape over SNMP
      LABELER_PRINTER_HOST: "192.168.8.235"
      # more than one printer:
      # LABELER_PRINTERS: '{"office":{"host":"192.168.8.235"},"desk":{"usb":true,"serial":"000F1Z401234"}}'
      # LABELER_PRINTER: office
      # LABELER_PRINTER_MODEL: P900W        # optional override
      # LABELER_PRINTER_TAPE_WIDTH: "24"    # optional override
      # LABELER_PRINTER_COMMUNITY: public
      # 2) or a printer on another computer running the printer agent:
      # LABELER_PRINTER_URL: "http://printer-pi:8631"
      # LABELER_PRINTER_TOKEN: "paste-the-token-of-the-agent"
      # 3) or try it without a printer:
      # LABELER_DEMO: "1"
      # Optional:
      # LABELER_ICON_API: ""         # switch off the icon search (or your own Iconify server)
      # LABELER_MAX_COPIES: "20"
    # 4) or a printer plugged into this Docker host: remove the printer settings above and
    #    pass the USB bus; the group id must be the one owning the printer's device node
    #    (with deploy/99-labeler-ptouch.rules on the host: the host's "lp" group, usually 7)
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # group_add:
    #   - "7"
